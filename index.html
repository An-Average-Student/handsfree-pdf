<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handsfree PDF</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <strong>Handsfree PDF</strong>
      <label class="btn">
        Open PDF
        <input id="file-input" type="file" accept="application/pdf" hidden />
      </label>
      <button id="camera-toggle">Start camera</button>
      <button id="settings-open">⚙ Gestures</button>
      <button id="present" title="Fullscreen presentation (F)">⛶ Present</button>
      <select id="camera-select" title="Choose camera" hidden></select>
      <span id="camera-status"></span>
      <span class="spacer"></span>
      <button id="fit-width" title="Fit page width to the screen">Fit width</button>
      <button id="fit-page" title="Fit the whole page on screen">Fit page</button>
      <button id="zoom-out" title="Zoom out (-)">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <span id="page-label"></span>
    </header>

    <main id="viewer">
      <div id="empty">Drop a PDF here, or click <em>Open PDF</em>.</div>
      <div id="pages"></div>
    </main>

    <div id="cam">
      <video id="cam-video" playsinline muted></video>
      <canvas id="cam-overlay"></canvas>
      <div id="cam-hud">OFF · show ✌️ for 1 second to start</div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <dialog id="settings">
      <header><strong>Choose your gestures</strong></header>
      <div id="settings-body"></div>
      <footer>
        <button id="settings-reset">Reset to defaults</button>
        <button id="settings-close">Done</button>
      </footer>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
